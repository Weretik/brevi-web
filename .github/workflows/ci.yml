name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run typecheck:tests:web
      - run: npm run test:web
      - run: npm run check:admin-libs
      - run: npx nx build admin-react --configuration=production
      - run: npx nx build storefront --configuration=production
      - run: npm run lint:site
      - run: npx nx run site:typecheck
      - run: npm run test:site
      - run: npx nx build site
