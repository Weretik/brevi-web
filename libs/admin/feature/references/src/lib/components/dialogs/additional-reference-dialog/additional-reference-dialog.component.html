<form [formRoot]="additionalReferenceForm" class="flex flex-col gap-4">
  @if (rootServerErrors().length) {
    <section
      class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200"
    >
      @for (error of rootServerErrors(); track $index) {
        <p>{{ error }}</p>
      }
    </section>
  }

  <div class="flex flex-col gap-2">
    <span class="text-sm font-medium text-surface-600 dark:text-surface-300">ID</span>
    @if (isEditMode) {
      <span
        class="flex h-10 items-center rounded-xl border border-surface-200 bg-white px-3 text-sm text-surface-900 dark:border-surface-800 dark:bg-surface-900/60 dark:text-surface-0"
      >
        {{ additionalReferenceModel().id }}
      </span>
    } @else {
      <input
        pInputText
        [formField]="additionalReferenceForm.id"
        type="number"
        step="1"
        class="h-10 w-full text-sm"
      />
      @if (fieldServerErrors('id').length) {
        <span class="text-xs text-red-600 dark:text-red-400">
          @for (error of fieldServerErrors('id'); track $index) {
            <span>{{ error }}</span>
          }
        </span>
      }
    }
  </div>

  <label class="flex flex-col gap-2">
    <span class="text-sm font-medium text-surface-600 dark:text-surface-300">Назва</span>
    <input
      pInputText
      [formField]="additionalReferenceForm.name"
      type="text"
      class="h-10 w-full text-sm"
    />
    @if (fieldServerErrors('name').length) {
      <span class="text-xs text-red-600 dark:text-red-400">
        @for (error of fieldServerErrors('name'); track $index) {
          <span>{{ error }}</span>
        }
      </span>
    }
  </label>

  <label class="flex flex-col gap-2">
    <span class="text-sm font-medium text-surface-600 dark:text-surface-300">Ключ</span>
    <input
      pInputText
      [formField]="additionalReferenceForm.key"
      type="text"
      class="h-10 w-full text-sm"
    />
    @if (fieldServerErrors('key').length) {
      <span class="text-xs text-red-600 dark:text-red-400">
        @for (error of fieldServerErrors('key'); track $index) {
          <span>{{ error }}</span>
        }
      </span>
    }
  </label>

  <label class="flex flex-col gap-2">
    <span class="text-sm font-medium text-surface-600 dark:text-surface-300">Значення</span>
    <input
      pInputText
      [formField]="additionalReferenceForm.value"
      type="number"
      step="0.01"
      class="h-10 w-full text-sm"
    />
    @if (fieldServerErrors('value').length) {
      <span class="text-xs text-red-600 dark:text-red-400">
        @for (error of fieldServerErrors('value'); track $index) {
          <span>{{ error }}</span>
        }
      </span>
    }
  </label>

  <label class="flex flex-col gap-2">
    <span class="text-sm font-medium text-surface-600 dark:text-surface-300">Одиниця</span>
    <input
      pInputText
      [formField]="additionalReferenceForm.unit"
      type="text"
      class="h-10 w-full text-sm"
    />
    @if (fieldServerErrors('unit').length) {
      <span class="text-xs text-red-600 dark:text-red-400">
        @for (error of fieldServerErrors('unit'); track $index) {
          <span>{{ error }}</span>
        }
      </span>
    }
  </label>

  <label class="flex flex-col gap-2">
    <span class="text-sm font-medium text-surface-600 dark:text-surface-300">Опис</span>
    <input
      pInputText
      [formField]="additionalReferenceForm.description"
      type="text"
      class="h-10 w-full text-sm"
    />
    @if (fieldServerErrors('description').length) {
      <span class="text-xs text-red-600 dark:text-red-400">
        @for (error of fieldServerErrors('description'); track $index) {
          <span>{{ error }}</span>
        }
      </span>
    }
  </label>

  <div class="flex items-center justify-end gap-2 pt-2">
    <button pButton type="button" text severity="secondary" size="small" (click)="cancel()">
      <i pButtonIcon class="pi pi-times"></i>
      <span pButtonLabel>Скасувати</span>
    </button>
    <button pButton type="button" size="small" [disabled]="isSaving()" (click)="save()">
      <i pButtonIcon class="pi pi-check"></i>
      <span pButtonLabel>Зберегти</span>
    </button>
  </div>
</form>
